name: Trade Business Lab Draft Generator

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Maximum number of drafts to generate"
        required: false
        default: "1"
      topic_id:
        description: "Optional exact topic ID (for testing/revisions)"
        required: false
        default: ""
      regenerate:
        description: "Overwrite an existing draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests beautifulsoup4
      - name: Research and generate draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          MAX_ARTICLES: ${{ inputs.max_articles || '1' }}
          TOPIC_ID: ${{ inputs.topic_id || '' }}
          REGENERATE: ${{ inputs.regenerate || 'false' }}
        run: python generator.py
      - name: Commit research and generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ research/
          if git diff --cached --quiet; then
            echo "No new draft to commit."
            exit 0
          fi
          git commit -m "draft: generate evidence-grounded Trade Business Lab article"
          git push
