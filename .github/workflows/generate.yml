name: Trade Business Lab Draft Generator

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Maximum number of new drafts to generate"
        required: false
        default: "1"
  # Keep scheduled generation off during Phase 1.
  # We will enable it only after the first drafts pass human review.

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          MAX_ARTICLES: ${{ inputs.max_articles || '1' }}
        run: python generator.py

      - name: Commit generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new draft to commit."
            exit 0
          fi
          git commit -m "draft: generate Trade Business Lab article"
          git push
